name: Rust Build

on:
  pull_request:
  push:
    branches:
      - development

jobs:
  build:
    name: Test Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: rustup toolchain install stable --profile minimal
      - run: sudo apt install -y protobuf-compiler
      - name: cargo build test
        run: cargo build
