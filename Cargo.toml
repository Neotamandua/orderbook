[workspace]
resolver = "2"

members = [
	"grpc-service",
	"orderbookX",
    "price"
]

[profile.release]
lto = "fat"


[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
orderbook-x = { path = "orderbookX" }
price = { path = "price" }

proptest = "1.2.0"
test-strategy = "0.3.1"
criterion = "0.5"
